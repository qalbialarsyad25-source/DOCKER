services:

  mysql:
    image: mysql:8.4

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_gizi

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: .

    container_name: geazy-backend

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

volumes:
  mysql_data: